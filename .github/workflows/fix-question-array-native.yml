name: Fix Practice 4 Question Array Natively
on:
  push:
    paths:
      - '.github/workflows/fix-question-array-native.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Atomically make Practice 4 own its 10/12 question count
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,base64,json,time,urllib.request,urllib.error,re
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}/contents/index.html'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sports-fiesta-fix'}
          for attempt in range(20):
            with urllib.request.urlopen(urllib.request.Request(api,headers=headers)) as r: data=json.load(r)
            raw=base64.b64decode(data['content']).decode()
            s=raw
            # Practice 4 owns its round count directly; no generic start wrapper.
            s=re.sub(r'function startGame\(m\)\{\s*\n\s*mode=m;', 'function startGame(m){\n  mode=m;\n  TOTAL = Number(m)===2 ? 12 : 10;', s, count=1)
            # Remove generic 2P array wrapper from this practice only.
            s='\n'.join(line for line in s.splitlines() if 'sports-fiesta-2p-12-round-v2.js' not in line and 'sports-fiesta-2p-12-round-v1.js' not in line)+'\n'
            # Ensure no old Next workarounds remain.
            s='\n'.join(line for line in s.splitlines() if 'practice4-next-native-' not in line and 'sports-fiesta-next-guard-v1.js' not in line)+'\n'
            if s==raw:
              print('Already fixed'); break
            payload=json.dumps({'message':'Fix Practice 4 full question array and native flow','content':base64.b64encode(s.encode()).decode(),'sha':data['sha']}).encode()
            req=urllib.request.Request(api,data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
            try:
              with urllib.request.urlopen(req) as r:
                out=json.load(r); print('Updated',out['commit']['sha']); break
            except urllib.error.HTTPError as e:
              if e.code in (409,422): time.sleep(1+attempt/2); continue
              raise
          else: raise SystemExit('Could not update index after retries')
          PY
