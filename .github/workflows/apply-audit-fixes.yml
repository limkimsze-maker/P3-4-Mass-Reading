name: Apply systematic audit fixes
on:
  push:
    paths:
      - '.github/workflows/apply-audit-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply audited runtime fixes atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, base64, time, re, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/contents/index.html'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for attempt in range(12):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req) as r: meta=json.load(r)
                  s=base64.b64decode(meta['content']).decode()
                  s2=re.sub(r'sports-fiesta-2p-12-round-v1\.js\?v=[^"\']+', 'sports-fiesta-2p-12-round-v2.js?v=20260812b', s)
                  if s2==s:
                      print('No change needed'); raise SystemExit(0)
                  payload=json.dumps({'message':'Use fair 12-question two-player audit layer','content':base64.b64encode(s2.encode()).decode(),'sha':meta['sha'],'branch':'main'}).encode()
                  put=urllib.request.Request(url,data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
                  with urllib.request.urlopen(put) as r: print(json.load(r)['commit']['sha'])
                  raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  if e.code in (409,422): time.sleep(1.5); continue
                  raise
          raise SystemExit('Could not apply audit patch after retries')
          PY
