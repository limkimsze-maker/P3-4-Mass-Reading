name: Live Real Practice 4 Next Test
on:
  push:
    paths:
      - '.github/workflows/live-real-next-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Run real answer then Next test
        run: |
          python - <<'PY'
          import time,urllib.request,traceback
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          url='https://limkimsze-maker.github.io/P3-4-Mass-Reading/'
          out=[]; d=None; failed=False
          try:
            for _ in range(30):
              try:
                h=urllib.request.urlopen(url+'?t='+str(time.time()),timeout=15).read().decode('utf-8','ignore')
                js=urllib.request.urlopen(url+'practice4-next-native-v2.js?t='+str(time.time()),timeout=15).read().decode('utf-8','ignore')
                if 'practice4-next-native-v2.js' in h and '__practice4NextNativeV2' in js: break
              except Exception as e: out.append('deploy-wait '+repr(e))
              time.sleep(4)
            else: raise RuntimeError('Updated P4 HTML/JS not live')
            o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1440,1000')
            d=webdriver.Chrome(options=o)
            for mode in (1,2):
              d.get(url+'?t='+str(time.time()));time.sleep(1.2)
              out.append(f'mode {mode} nativeFlag='+str(d.execute_script("return !!window.__practice4NextNativeV2")))
              out.append(f'mode {mode} oldFixFlag='+str(d.execute_script("return !!window.__practice4NextFixV1")))
              d.execute_script(f'startGame({mode})');time.sleep(.5)
              for step in range(3):
                before=d.execute_script("return document.getElementById('round').textContent.trim()")
                state=d.execute_script("return {round:round,total:TOTAL,answered:answered,q:questions[round]&&questions[round].totalGrams,cls:document.getElementById('nextBtn').className,disabled:document.getElementById('nextBtn').disabled}")
                out.append(f'before mode={mode} step={step+1} {state}')
                total=state['q']; kg=total//1000; g=total%1000
                d.execute_script("document.getElementById('kgInput').value=arguments[0];document.getElementById('gInput').value=arguments[1];",str(kg),str(g))
                d.find_element('id','checkBtn').click();time.sleep(.35)
                fb=d.find_element('id','feedback').text
                state2=d.execute_script("return {round:round,answered:answered,cls:document.getElementById('nextBtn').className,disabled:document.getElementById('nextBtn').disabled,display:getComputedStyle(document.getElementById('nextBtn')).display}")
                out.append(f'after-check fb={fb!r} state={state2}')
                if 'Correct' not in fb: raise RuntimeError(f'mode {mode}: correct answer not accepted')
                btn=d.find_element('id','nextBtn'); btn.click(); time.sleep(.45)
                after=d.execute_script("return document.getElementById('round').textContent.trim()")
                state3=d.execute_script("return {round:round,answered:answered,cls:document.getElementById('nextBtn').className,disabled:document.getElementById('nextBtn').disabled}")
                out.append(f'after-next {before!r}->{after!r} state={state3}')
                if before==after: raise RuntimeError(f'mode {mode}: Next did not advance')
            out.insert(0,'PASS')
          except Exception as e:
            failed=True; out.insert(0,'FAIL'); out.append('ERROR '+repr(e)); out.append(traceback.format_exc())
          finally:
            if d:
              try:d.quit()
              except:pass
          open('p4-next-live-result.txt','w').write('\n'.join(out)+'\n')
          if failed: open('p4-next-live-failed.flag','w').write('1')
          else:
            import os
            if os.path.exists('p4-next-live-failed.flag'): os.remove('p4-next-live-failed.flag')
          PY
      - name: Commit diagnostic result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add p4-next-live-result.txt p4-next-live-failed.flag 2>/dev/null || true
          git add -u p4-next-live-failed.flag 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Record Practice 4 real Next test result'
          git push || true
      - name: Enforce result
        run: test ! -f p4-next-live-failed.flag
