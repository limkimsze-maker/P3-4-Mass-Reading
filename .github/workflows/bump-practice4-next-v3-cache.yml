name: Bump Practice 4 Next v3 cache
on:
  push:
    paths:
      - '.github/workflows/bump-practice4-next-v3-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('practice4-next-local-v3.js?v=20260813b','practice4-next-local-v3.js?v=20260813c')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Bump Practice 4 Next cache version"
          git pull --rebase origin main
          git push origin HEAD:main
