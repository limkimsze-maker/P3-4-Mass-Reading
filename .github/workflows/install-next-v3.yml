name: Install Practice 4 Next v3
on:
  push:
    paths:
      - '.github/workflows/install-next-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace old Next workaround with v3
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="practice4-next-native-v2.js?v=20260812a"></script>', '<script src="practice4-next-native-v3.js?v=20260813a"></script>')
          s=s.replace('<script src="practice4-next-native-v2.js"></script>', '<script src="practice4-next-native-v3.js?v=20260813a"></script>')
          # Remove any generic Next workaround if an older automation re-added it.
          lines=[line for line in s.splitlines() if 'sports-fiesta-next-guard-v1.js' not in line]
          s='\n'.join(lines)+'\n'
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use cache-busted Practice 4 Next v3"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
