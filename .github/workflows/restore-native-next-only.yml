name: Restore Practice 4 Native Next Only
on:
  push:
    paths:
      - '.github/workflows/restore-native-next-only.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove all added Next-handler scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          lines=p.read_text().splitlines()
          bad=('practice4-next-native-v2.js','practice4-next-native-v3.js','sports-fiesta-next-guard-v1.js')
          lines=[line for line in lines if not any(x in line for x in bad)]
          p.write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore Practice 4 native Next flow only"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
