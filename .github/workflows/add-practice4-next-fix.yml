name: Add Practice 4 Next Fix
on:
  push:
    paths:
      - '.github/workflows/add-practice4-next-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Add final Next handler atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,base64,time,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/contents/index.html'
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          tag='<script src="practice4-next-fix-v1.js?v=20260812a"></script>'
          for _ in range(12):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=h)) as r:m=json.load(r)
              s=base64.b64decode(m['content']).decode()
              if 'practice4-next-fix-v1.js' in s: raise SystemExit(0)
              s2=s.replace('</body>',tag+'\n</body>')
              if s2==s: raise SystemExit('Could not find </body>')
              p=json.dumps({'message':'Load Practice 4 protected Next handler','content':base64.b64encode(s2.encode()).decode(),'sha':m['sha'],'branch':'main'}).encode()
              req=urllib.request.Request(url,data=p,headers={**h,'Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req) as r:print(json.load(r)['commit']['sha'])
              raise SystemExit(0)
            except urllib.error.HTTPError as e:
              if e.code in (409,422): time.sleep(1.5); continue
              raise
          raise SystemExit('Could not patch after retries')
          PY
