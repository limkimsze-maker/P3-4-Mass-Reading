name: Install Practice 4 Native Next v2
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch index atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,base64,time,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/contents/index.html'
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          tag='<script src="practice4-next-native-v2.js?v=20260812a"></script>'
          for _ in range(12):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h)) as r:m=json.load(r)
            s=base64.b64decode(m['content']).decode()
            # Remove older Practice 4 Next workarounds and shared Next guard from this page.
            s='\n'.join(line for line in s.splitlines() if 'practice4-next-fix-v1.js' not in line and 'sports-fiesta-next-guard-v1.js' not in line)+'\n'
            if 'practice4-next-native-v2.js' not in s:
              s=s.replace('</body>',tag+'\n</body>')
            p=json.dumps({'message':'Use clean Practice 4 native Next v2','content':base64.b64encode(s.encode()).decode(),'sha':m['sha'],'branch':'main'}).encode()
            req=urllib.request.Request(url,data=p,headers={**h,'Content-Type':'application/json'},method='PUT')
            try:
              with urllib.request.urlopen(req) as r: print(json.load(r)['commit']['sha'])
              break
            except urllib.error.HTTPError as e:
              if e.code in (409,422): time.sleep(1.5); continue
              raise
          else: raise SystemExit('Could not update index.html')
          PY
