name: Atomic Restore Native Next
on:
  push:
    paths:
      - '.github/workflows/restore-native-next-api.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Atomically remove added Next scripts from latest index
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,base64,json,time,urllib.request,urllib.error
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}/contents/index.html'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sports-fiesta-fix'}
          bad=('practice4-next-native-v2.js','practice4-next-native-v3.js','sports-fiesta-next-guard-v1.js')
          for attempt in range(20):
            req=urllib.request.Request(api,headers=headers)
            with urllib.request.urlopen(req) as r: data=json.load(r)
            raw=base64.b64decode(data['content']).decode()
            lines=raw.splitlines()
            new='\n'.join(line for line in lines if not any(x in line for x in bad))+'\n'
            if new==raw:
              print('Already native-only'); break
            payload=json.dumps({'message':'Restore Practice 4 native Next only','content':base64.b64encode(new.encode()).decode(),'sha':data['sha']}).encode()
            req=urllib.request.Request(api,data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
            try:
              with urllib.request.urlopen(req) as r:
                out=json.load(r); print('Updated',out['commit']['sha']); break
            except urllib.error.HTTPError as e:
              if e.code in (409,422):
                time.sleep(1+attempt/2); continue
              raise
          else:
            raise SystemExit('Could not update index after retries')
          PY
