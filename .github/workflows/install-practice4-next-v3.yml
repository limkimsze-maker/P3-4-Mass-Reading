name: Install Practice 4 Next v3
on:
  push:
    paths:
      - 'practice4-next-local-v3.js'
      - '.github/workflows/install-practice4-next-v3.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire v3 handler into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="practice4-next-local-v3.js?v=20260813b"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Wire Practice 4 Next v3"
          git pull --rebase origin main
          git push origin HEAD:main
